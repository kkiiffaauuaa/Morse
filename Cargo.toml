[package]
name = "morse"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = [ "Jaŭhien Lavonćjeŭ <jauhien.lavoncjeu@gmail.com>" ]
repository = "https://github.com/teacond/Morse"
homepage = "https://github.com/teacond/Morse"

[build-dependencies]
winresource = "0.1.31"

[dependencies]
anyhow = { version = "1.0.102", default-features = false }
rand = { version = "0.10.0", features = ["std_rng"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11.1", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_9"] }
strum = "0.28.0"
strum_macros = "0.28.0"
regex = "1.12.3"
serde_json = "1.0"

morse_player = { git = "https://github.com/teacond/morse_player", rev="db54291039ca36d09e2e9621eb59374d86c5a9a5" }
