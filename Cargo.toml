[package]
name = "morse"
version = "1.0.4"
edition = "2021"
license = "GPL-3.0-or-later"
authors = [ "Jaŭhien Lavonćjeŭ <jauhien.lavoncjeu@gmail.com>" ]
repository = "https://github.com/teacond/Morse"
homepage = "https://github.com/teacond/Morse"

[build-dependencies]
winresource = "0.1.29"

[dependencies]
anyhow = { version = "1.0.100", default-features = false }
rand = { version = "0.9.2", features = ["thread_rng"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }

gtk = { package = "gtk4", version = "0.10.3", features = ["gnome_48"] }
adw = { package = "libadwaita", version = "0.8.1", features = ["v1_8"] }
strum = "0.27.2"
strum_macros = "0.27.2"
regex = "1.12.2"

morse_player = { git = "https://github.com/teacond/morse_player", rev="86b3bdf" }
