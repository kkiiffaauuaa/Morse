name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: morse.flatpak
          manifest-path: build-aux/io.teacond.Morse.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          verbose: true
  
  windows:
    name: Windows
    strategy:
      matrix:
        include:
          - sys: clang64
            env: clang-x86_64
            runner: windows-latest
            arch: x64
          - sys: clangarm64
            env: clang-aarch64
            runner: windows-11-arm
            arch: arm64
    runs-on: ${{matrix.runner}}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - name: "Setup MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          update: true
          install: >-
            base-devel git mingw-w64-${{matrix.env}}-toolchain mingw-w64-${{matrix.env}}-cc
            mingw-w64-${{matrix.env}}-meson mingw-w64-${{matrix.env}}-ninja
            mingw-w64-${{matrix.env}}-pkg-config mingw-w64-${{matrix.env}}-ca-certificates
            mingw-w64-${{matrix.env}}-shaderc mingw-w64-${{matrix.env}}-curl
            mingw-w64-${{matrix.env}}-cmake mingw-w64-${{matrix.env}}-libxml2
            mingw-w64-${{matrix.env}}-gettext mingw-w64-${{matrix.env}}-vulkan
            mingw-w64-${{matrix.env}}-vulkan-headers mingw-w64-${{matrix.env}}-rust
            mingw-w64-${{matrix.env}}-python mingw-w64-${{matrix.env}}-python-pip
            mingw-w64-${{matrix.env}}-appstream mingw-w64-${{matrix.env}}-glib2
            mingw-w64-${{matrix.env}}-ccache mingw-w64-${{matrix.env}}-gobject-introspection
            mingw-w64-${{matrix.env}}-cairo mingw-w64-${{matrix.env}}-directx-headers
            mingw-w64-${{matrix.env}}-gdk-pixbuf2 mingw-w64-${{matrix.env}}-graphene
            mingw-w64-${{matrix.env}}-json-glib mingw-w64-${{matrix.env}}-libepoxy
            mingw-w64-${{matrix.env}}-fribidi mingw-w64-${{matrix.env}}-gst-plugins-bad-libs
            mingw-w64-${{matrix.env}}-shared-mime-info mingw-w64-${{matrix.env}}-python-gobject
            mingw-w64-${{matrix.env}}-sassc mingw-w64-${{matrix.env}}-pango
            mingw-w64-${{matrix.env}}-blueprint-compiler mingw-w64-${{matrix.env}}-python-setuptools
      - name: "Download Dependency Sources"
        run: |
          git clone https://gitlab.gnome.org/GNOME/gtk --depth 1
          git clone https://gitlab.gnome.org/GNOME/libadwaita --depth 1
      - name: Build Dependencies
        run: |
          export CC=clang
          export CXX=clang++
          cd gtk
          meson setup build -Dprefix=/${{matrix.sys}} -Dintrospection=enabled -Dmedia-gstreamer=disabled -Dbuild-tests=false -Dvulkan=enabled -Dsysprof=disabled -Dwin32-backend=true -Dx11-backend=false -Dwayland-backend=false
          meson install -C build
          cd ../
          cd libadwaita
          meson setup build -Dprefix=/${{matrix.sys}} -Dintrospection=enabled -Dvapi=false -Ddocumentation=false -Dtests=false
          meson install -C build
          cd ../
      - name: Build Package
        run: |
          meson setup build -Dprefix=$(pwd)/dist -Dprofile=default
          meson install -C build
          ldd dist/bin/morse.exe | grep /${{matrix.sys}}/bin | cp $(awk '{print $3}') dist/bin
          cp /${{matrix.sys}}/bin/gdbus.exe dist/bin
          mkdir -p dist/lib/gdk-pixbuf-2.0
          cp -r /${{matrix.sys}}/lib/gdk-pixbuf-2.0/* dist/lib/gdk-pixbuf-2.0
      - name: Build Installer
        shell: powershell
        run: |
          iscc /DCPUType=${{matrix.arch}} build-aux/morse_inno.iss
      - uses: actions/upload-artifact@v6
        with:
          name: Morse_Installer_Windows_${{matrix.arch}}
          path: Output/*.exe
  macos:
    name: MacOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: "Install System Packages"
        run: |
          brew install meson ninja rust glib cmake pkgconf gettext appstream \
          ccache gobject-introspection cairo gdk-pixbuf graphene json-glib \
          librsvg libepoxy fribidi sassc pango blueprint-compiler python \
          python-setuptools vulkan-loader shaderc molten-vk dylibbundler \
          create-dmg
      - name: "Download Dependency Sources"
        run: |
          git clone https://gitlab.gnome.org/GNOME/gtk --depth 1
          git clone https://gitlab.gnome.org/GNOME/libadwaita --depth 1
      - name: Build Dependencies
        run: |
          cd gtk
          meson setup build -Dintrospection=enabled -Dmedia-gstreamer=disabled -Dbuild-tests=false -Dvulkan=enabled -Dsysprof=disabled -Dx11-backend=false -Dwayland-backend=false -Dmacos-backend=true
          meson install -C build
          cd ../
          cd libadwaita
          meson setup build -Dintrospection=enabled -Dvapi=false -Ddocumentation=false -Dtests=false
          meson install -C build
          cd ../
      - name: Build Package
        run: |
          meson setup build -Dprefix=$(pwd)/Morse.app -Ddatadir=Contents/Resources -Dbindir=Contents/MacOS -Dlocaledir=Contents/Resources/locale -Dprofile=default
          meson install -C build
          dylibbundler -od -b -x Morse.app/Contents/MacOS/morse -d Morse.app/Contents/Frameworks/
          mkdir morse.iconset
          for size in 16 32 128 256 512; do
              rsvg-convert -w $size -h $size data/icons/hicolor/scalable/apps/io.teacond.Morse.svg -o morse.iconset/icon_${size}x${size}.png
              rsvg-convert -w $((size*2)) -h $((size*2)) data/icons/hicolor/scalable/apps/io.teacond.Morse.svg -o morse.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns morse.iconset
          cp morse.icns Morse.app/Contents/Resources
          cp build-aux/Info.plist Morse.app/Contents/Info.plist
      - name: Build Installer
        run: |
          create-dmg --volname "Morse Installer" --volicon "morse.icns" --window-pos 200 120 \
          --window-size 800 400 --icon-size 100 --icon "Morse.app" 200 190 --hide-extension "Morse.app" \
          --app-drop-link 600 185 --skip-jenkins "Morse.dmg" "./Morse.app"
      - uses: actions/upload-artifact@v6
        with:
          name: Morse_Installer_MacOS_arm64
          path: Morse.dmg