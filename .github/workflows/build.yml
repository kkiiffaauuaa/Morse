name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{matrix.runner}}
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: morse-${{matrix.arch}}.flatpak
          manifest-path: build-aux/flatpak/io.github.teacond.Morse.Devel.json
          cache-key: flatpak-builder-${{github.sha}}
          arch: ${{matrix.arch}}
          verbose: true
          upload-artifact: false
      - uses: actions/upload-artifact@v6
        with:
          name: morse-flatpak-${{matrix.arch}}
          path: morse-${{matrix.arch}}.flatpak
  
  windows:
    name: Windows
    if: github.ref_type == 'tag'
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        include:
          - sys: clang64
            env: clang-x86_64
            runner: windows-latest
            arch: x64compatible
            arch-name: x86_64
          - sys: clangarm64
            env: clang-aarch64
            runner: windows-11-arm
            arch: arm64
            arch-name: aarch64
    runs-on: ${{matrix.runner}}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - name: "Setup MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          update: true
          install: >-
            mingw-w64-${{matrix.env}}-git mingw-w64-${{matrix.env}}-meson
            mingw-w64-${{matrix.env}}-gettext mingw-w64-${{matrix.env}}-rust
            mingw-w64-${{matrix.env}}-gtk4 mingw-w64-${{matrix.env}}-libadwaita
            mingw-w64-${{matrix.env}}-blueprint-compiler
      - name: Build Package
        run: |
          meson setup build -Dprefix=$(pwd)/dist -Dprofile=default
          meson install -C build
          ldd dist/bin/morse.exe | grep /${{matrix.sys}}/bin | cp $(awk '{print $3}') dist/bin
          cp /${{matrix.sys}}/bin/gdbus.exe dist/bin
          mkdir -p dist/lib/gdk-pixbuf-2.0
          cp -r /${{matrix.sys}}/lib/gdk-pixbuf-2.0/* dist/lib/gdk-pixbuf-2.0
      - name: Build Installer
        shell: powershell
        run: |
          iscc /DCPUType=${{matrix.arch}} /DOutputFilename=morse-{{matrix.arch-name}} /DVersion="$((meson introspect --projectinfo build | ConvertFrom-Json).version)" build-aux/windows/morse_inno.iss
      - uses: actions/upload-artifact@v6
        with:
          name: morse-win-${{matrix.arch-name}}
          path: Output/*.exe
  
  macos:
    name: MacOS
    runs-on: macos-26
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6
      - name: "Install System Packages"
        run: |
          brew update
          brew install meson gettext rust gtk4 libadwaita blueprint-compiler create-dmg dylibbundler librsvg
      - name: Build Package
        shell: zsh {0}
        run: |
          ./build-aux/macos/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: morse-macos-aarch64
          path: morse-aarch64.dmg
  
  debian:
    name: "Debian"
    continue-on-error: true
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{matrix.runner}}
    container: debian:sid
    steps:
      - uses: actions/checkout@v6
      - name: Build Package
        run: |
          apt update
          apt install -y debhelper devscripts
          apt build-dep -y .
          dpkg-buildpackage -b -uc -us
          mv ../morse-gtk_*.deb ./
      - uses: actions/upload-artifact@v6
        with:
          name: morse-deb-${{matrix.arch}}
          path: morse-gtk_*.deb
  
  publish:
    name: Publish Release
    needs: [flatpak, windows, macos, debian]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./binaries
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./binaries/*
          generate_release_notes: true
